<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">OyunPazar</a>

    <div class="container mt-5 mb-5">
        <h2 class="border-bottom border-secondary pb-2 mb-4">Tüm İlanlar</h2>
        
        <div class="row mb-4">
            <div class="col-md-12 d-flex flex-wrap gap-2">
                <button class="btn btn-warning" onclick="filtrele('hepsi')">Tüm İlanlar</button>
                <button class="btn btn-outline-warning" onclick="filtrele('csgo')">CS:GO</button>
                <button class="btn btn-outline-warning" onclick="filtrele('valorant')">Valorant</button>
                <button class="btn btn-outline-warning" onclick="filtrele('ko')">Knight Online</button>
            </div>
        </div>

        <div class="row g-4" id="ilanlar-kutusu">
            
            <div class="col-md-3 col-sm-6 ilan-karti" data-kategori="csgo">
                <div class="card bg-secondary text-white custom-card h-100">
                    <img src="https://placehold.co/400x300/1a1a1a/ffc107?text=AK-47+Redline" class="card-img-top" alt="Item">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-warning">AK-47 | Redline</h6>
                        <h5 class="mb-3 mt-auto">450.00 TL</h5>
                        <a href="product-detail.html" class="btn btn-dark w-100 border border-warning">İncele</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3 col-sm-6 ilan-karti" data-kategori="valorant">
                <div class="card bg-secondary text-white custom-card h-100">
                    <img src="https://placehold.co/400x300/1a1a1a/ffc107?text=Asil+Vandal" class="card-img-top" alt="Item">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-warning">Asil Vandal</h6>
                        <h5 class="mb-3 mt-auto">1,250.00 TL</h5>
                        <a href="product-detail.html" class="btn btn-dark w-100 border border-warning">İncele</a>

                </div>
            </div>

            <div class="col-md-3 col-sm-6 ilan-karti" data-kategori="ko">
                <div class="card bg-secondary text-white custom-card h-100">
                    <img src="https://placehold.co/400x300/1a1a1a/ffc107?text=Raptor+%2B8" class="card-img-top" alt="Item">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-warning">Raptor +8</h6>
                        <h5 class="mb-3 mt-auto">3,500.00 TL</h5>
                        <a href="product-detail.html" class="btn btn-dark w-100 border border-warning">İncele</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6 ilan-karti" data-kategori="csgo">
                <div class="card bg-secondary text-white custom-card h-100">
                    <img src="https://placehold.co/400x300/1a1a1a/ffc107?text=AWP+Asiimov" class="card-img-top" alt="Item">
