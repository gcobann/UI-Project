<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pazar Yeri - OyunPazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html"><i class="fas fa-gamepad me-2"></i>OyunPazar</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link active" href="marketplace.html">Pazar Yeri</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white m-0">İlan Pazarı</h2>
            <div class="btn-group">
                <button class="btn btn-outline-warning btn-sm" onclick="filtrele('hepsi')">Hepsi</button>
                <button class="btn btn-outline-warning btn-sm" onclick="filtrele('cs2')">CS2</button>
                <button class="btn btn-outline-warning btn-sm" onclick="filtrele('valorant')">Valo</button>
                <button class="btn btn-outline-warning btn-sm" onclick="filtrele('ko')">K.O</button>
            </div>
        </div>

        <div class="row g-4" id="ilanlar-kutusu">
            <div class="col-md-3 ilan-karti" data-kategori="cs2">
                <div class="ilan-karti-inner">
                    <img src="img/ak47redline-ilan.png" class="ilan-bg-img">
                    <div class="ilan-content">
                        <span class="badge bg-warning text-dark mb-2 w-50">CS2</span>
                        <h5 class="text-white fw-bold">AK-47 | Redline</h5>
                        <h4 class="text-success mt-auto mb-3">450.00 TL</h4>
                        <a href="product-detail.html?item=ak47" class="btn btn-outline-light w-100">İncele</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3 ilan-karti" data-kategori="valorant">
                <div class="ilan-karti-inner">
                    <img src="img/asilvandal-ilan.png" class="ilan-bg-img">
                    <div class="ilan-content">
                        <span class="badge bg-danger text-white mb-2 w-50">Valorant</span>
                        <h5 class="text-white fw-bold">Asil Vandal</h5>
                        <h4 class="text-success mt-auto mb-3">850.00 TL</h4>
                        <a href="product-detail.html?item=vandal" class="btn btn-outline-light w-100">İncele</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3 ilan-karti" data-kategori="cs2">
                <div class="ilan-karti-inner">
                    <img src="img/awpasiimov-ilan.png" class="ilan-bg-img">
                    <div class="ilan-content">
                        <span class="badge bg-warning text-dark mb-2 w-50">CS2</span>
                        <h5 class="text-white fw-bold">AWP | Asiimov</h5>
                        <h4 class="text-success mt-auto mb-3">1,250.00 TL</h4>
                        <a href="product-detail.html?item=awp" class="btn btn-outline-light w-100">İncele</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3 ilan-karti" data-kategori="ko">
                <div class="ilan-karti-inner">
                    <img src="img/raptor-ilan.png" class="ilan-bg-img">
                    <div class="ilan-content">
                        <span class="badge bg-info text-dark mb-2 w-75">Knight Online</span>
                        <h5 class="text-white fw-bold">Raptor +8</h5>
                        <h4 class="text-success mt-auto mb-3">3,000.00 TL</h4>
                        <a href="product-detail.html?item=raptor" class="btn btn-outline-light w-100">İncele</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
