<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>OyunPazar - Ana Sayfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html"><i class="fas fa-gamepad me-2"></i>OyunPazar</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="marketplace.html">Pazar Yeri</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Giriş Yap</a></li>
                    <li class="nav-item me-3"><a class="nav-link text-warning" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Kayıt Ol</a></li>
                    <li class="nav-item"><a class="btn btn-outline-warning" href="wallet.html"><i class="fas fa-wallet me-1"></i> Cüzdanım</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero-box text-center">
            <h1 class="display-4 fw-bold text-white">Oyun Dünyasının En Güvenli Pazarı</h1>
            <p class="lead text-secondary">Güvenli alışverişin adresi.</p>
            <a href="marketplace.html" class="btn btn-warning btn-lg mt-3 fw-bold">Tüm İlanları Gör</a>
        </div>
    </div>

    <section class="container mb-5">
        <h2 class="mb-4 text-white"><i class="fas fa-fire text-warning me-2"></i>Popüler Kategoriler</h2>
        <div class="row g-4">
            <div class="col-md-4"><a href="marketplace.html?filter=cs2" class="category-card"><h3 class="text-warning fw-bold">CS2</h3></a></div>
            <div class="col-md-4"><a href="marketplace.html?filter=valorant" class="category-card"><h3 class="text-danger fw-bold">Valorant</h3></a></div>
            <div class="col-md-4"><a href="marketplace.html?filter=ko" class="category-card"><h3 class="text-info fw-bold">Knight Online</h3></a></div>
        </div>
    </section>

    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-warning">
                <div class="modal-header border-secondary"><h5 class="modal-title">Giriş Yap / Kayıt Ol</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form onsubmit="sahteGiris(event)">
                        <div class="mb-3"><label class="form-label">Kullanıcı Adı / E-Posta</label><input type="text" class="form-control bg-black text-white border-secondary"></div>
                        <div class="mb-3"><label class="form-label">Şifre</label><input type="password" class="form-control bg-black text-white border-secondary"></div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">Devam Et</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
