<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cüzdanım - OyunPazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html"><i class="fas fa-gamepad me-2"></i>OyunPazar</a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group bg-dark border-secondary" role="tablist">
                    <a class="list-group-item list-group-item-action active bg-transparent text-white border-secondary" data-bs-toggle="list" href="#list-cuzdan">Cüzdanım</a>
                    <a class="list-group-item list-group-item-action bg-transparent text-white border-secondary" data-bs-toggle="list" href="#list-ilan">Aktif İlanlarım</a>
                    <a class="list-group-item list-group-item-action bg-transparent text-white" data-bs-toggle="list" href="#list-gecmis">Geçmiş</a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="list-cuzdan">
                        <div class="card bg-black border-secondary p-4">
                            <h6 class="text-secondary">Bakiye</h6>
                            <h1 class="text-success fw-bold" id="bakiye-ekrani">0.00 TL</h1>
                            <button class="btn btn-success mt-3" onclick="bakiyeYukle()">Bakiye Yükle</button>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="list-ilan">
                        <h4 class="text-white mb-3">Satıştaki Ürünlerim</h4>
                        <div class="list-group">
                            <div class="list-group-item bg-dark border-secondary text-white d-flex justify-content-between align-items-center">
                                <span>CS2 - AWP | Asiimov</span>
                                <span class="text-success fw-bold">1,250.00 TL</span>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="list-gecmis">
                        <h4 class="text-white mb-3">Satın Alma Geçmişi</h4>
                        <table class="table table-dark">
                            <thead><tr><th>Tarih</th><th>Ürün</th><th>Tutar</th></tr></thead>
                            <tbody><tr><td>20.04.2026</td><td>AK-47 | Redline</td><td class="text-danger">-450.00 TL</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
